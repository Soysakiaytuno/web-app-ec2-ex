<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hotel Mirador · Recepción</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="titulo">
    <h1 class="titulo__principal">Hotel Mirador</h1>
    <p class="titulo__subtitulo">Sistema de recepción</p>
    <nav class="nav">
      <button type="button" class="nav__ruta nav__ruta--activo" data-tab="reservations">Reservas</button>
      <button type="button" class="nav__ruta nav__ruta--inactivo" data-tab="rooms">Habitaciones</button>
      <button type="button" class="nav__ruta nav__ruta--inactivo" data-tab="guests">Huéspedes</button>
    </nav>
  </header>

  <main class="contenedor">
    <div id="msg" class="alerta" hidden></div>

    <!-- RESERVAS -->
    <section id="tab-reservations" class="seccion-tab">
      <div class="tarjeta">
        <h2 class="tarjeta__titulo">Nueva reserva</h2>
        <form id="reservation-form" class="formulario">
          <label class="formulario__campo">
            <span class="formulario__etiqueta">Habitación</span>
            <select name="room_id" id="reservation-room" class="formulario__selector" required></select>
          </label>
          <label class="formulario__campo">
            <span class="formulario__etiqueta">Huésped</span>
            <select name="guest_id" id="reservation-guest" class="formulario__selector" required></select>
          </label>
          <label class="formulario__campo">
            <span class="formulario__etiqueta">Ingreso</span>
            <input type="date" name="check_in" class="formulario__entrada" required>
          </label>
          <label class="formulario__campo">
            <span class="formulario__etiqueta">Salida</span>
            <input type="date" name="check_out" class="formulario__entrada" required>
          </label>
          <label class="formulario__campo">
            <span class="formulario__etiqueta">Personas</span>
            <input type="number" name="guests_count" class="formulario__entrada" min="1" value="1" required>
          </label>
          <button type="submit" class="boton">Reservar</button>
        </form>
      </div>

      <div class="tarjeta">
        <div class="tarjeta__cabecera">
          <h2 class="tarjeta__titulo">Reservas</h2>
          <select id="reservation-filter" class="formulario__selector">
            <option value="">Todas</option>
            <option value="confirmed">Confirmadas</option>
            <option value="checked_in">Hospedados</option>
            <option value="checked_out">Finalizadas</option>
            <option value="cancelled">Canceladas</option>
          </select>
        </div>
        <table class="data">
          <thead class="data__cabecera">
            <tr class="fila">
              <th class="data__encabezado">#</th>
              <th class="data__encabezado">Hab.</th>
              <th class="data__encabezado">Huésped</th>
              <th class="data__encabezado">Ingreso</th>
              <th class="data__encabezado">Salida</th>
              <th class="data__encabezado">Noches</th>
              <th class="data__encabezado">Personas</th>
              <th class="data__encabezado">Total (Bs)</th>
              <th class="data__encabezado">Estado</th>
              <th class="data__encabezado"></th>
            </tr>
          </thead>
          <tbody id="reservations-body" class="data__cuerpo"></tbody>
        </table>
      </div>
    </section>

    <!-- HABITACIONES -->
    <section id="tab-rooms" class="seccion-tab" hidden>
      <div class="tarjeta">
        <h2 class="tarjeta__titulo">Nueva habitación</h2>
        <form id="room-form" class="formulario">
          <label class="formulario__campo">
            <span class="formulario__etiqueta">Número</span>
            <input name="number" class="formulario__entrada" required>
          </label>
          <label class="formulario__campo">
            <span class="formulario__etiqueta">Tipo</span>
            <select name="type" class="formulario__selector">
              <option value="single">Simple</option>
              <option value="double">Doble</option>
              <option value="family">Familiar</option>
              <option value="suite">Suite</option>
            </select>
          </label>
          <label class="formulario__campo">
            <span class="formulario__etiqueta">Precio por noche (Bs)</span>
            <input type="number" name="price_per_night" class="formulario__entrada" min="1" required>
          </label>
          <label class="formulario__campo">
            <span class="formulario__etiqueta">Capacidad</span>
            <input type="number" name="capacity" class="formulario__entrada" min="1" value="2" required>
          </label>
          <button type="submit" class="boton">Guardar</button>
        </form>
      </div>

      <div class="tarjeta">
        <h2 class="tarjeta__titulo">Habitaciones</h2>
        <table class="data">
          <thead class="data__cabecera">
            <tr class="fila">
              <th class="data__encabezado">Número</th>
              <th class="data__encabezado">Tipo</th>
              <th class="data__encabezado">Precio</th>
              <th class="data__encabezado">Capacidad</th>
              <th class="data__encabezado">Estado</th>
              <th class="data__encabezado"></th>
            </tr>
          </thead>
          <tbody id="rooms-body" class="data__cuerpo"></tbody>
        </table>
      </div>
    </section>

    <!-- HUÉSPEDES -->
    <section id="tab-guests" class="seccion-tab" hidden>
      <div class="tarjeta">
        <h2 class="tarjeta__titulo">Nuevo huésped</h2>
        <form id="guest-form" class="formulario">
          <label class="formulario__campo">
            <span class="formulario__etiqueta">Nombre completo</span>
            <input name="full_name" class="formulario__entrada" required>
          </label>
          <label class="formulario__campo">
            <span class="formulario__etiqueta">Email</span>
            <input type="email" name="email" class="formulario__entrada" required>
          </label>
          <label class="formulario__campo">
            <span class="formulario__etiqueta">Documento</span>
            <input name="document" class="formulario__entrada" required>
          </label>
          <button type="submit" class="boton">Guardar</button>
        </form>
      </div>

      <div class="tarjeta">
        <h2 class="tarjeta__titulo">Huéspedes</h2>
        <table class="data">
          <thead class="data__cabecera">
            <tr class="fila">
              <th class="data__encabezado">Nombre</th>
              <th class="data__encabezado">Email</th>
              <th class="data__encabezado">Documento</th>
              <th class="data__encabezado"></th>
            </tr>
          </thead>
          <tbody id="guests-body" class="data__cuerpo"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script type="module" src="js/app.js"></script>
</body>
</html>
